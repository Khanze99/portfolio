version: '3'


services:
  db:
    image: postgres
    container_name: khnz-db
    env_file:
      .env
    ports:
      - 5432:5432
    volumes:
      - db_volume:/var/lib/postgresql/data
    networks:
      - khnz_network

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
    depends_on:
      - core

  core:
    image: khnz-core
    command: 'gunicorn khnz.wsgi:application --bind 0.0.0.0:8000'
    expose:
      - 8000
    env_file:
      .env
    ports:
      - '8000:8000'
    volumes:
      - ./khnz:/app
    depends_on:
      - db
    networks:
      - khnz_network

  rabbitmq:
    image: "rabbitmq:3-management"
    hostname: "rabbitmq"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - khnz_network

  celery:
    image: khnz-core
    command: celery -A khnz worker -l info
    volumes:
      - ./khnz:/app
    env_file:
      .env
    depends_on:
      - db
      - redis
      - rabbitmq
    networks:
      - khnz_network

  redis:
    image: redis:6
    restart: always
    ports:
      - "6379:6379"
    networks:
      - khnz_network

networks:
  khnz_network:


volumes:
  db_volume:
  rabbitmq_data: